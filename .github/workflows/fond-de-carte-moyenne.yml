name: Fond de carte — boîte moyenne (64 Mpc/h)

# Chantier D (18/11/2026) : une troisième boîte, 3,1 fois plus fine que la petite, pour les champs
# de 10 à 100 millions d'années-lumière (filaments nets, plus de treillis agrandi). Même simulation
# particle-mesh 512³, mêmes 32 instantanés réguliers en croissance, même post-traitement que la v2.
# Essai 2 (18/11, 15 h 50) : tranche de 10 Mpc/h (au lieu de 4) : la tranche fine de l'essai 1 ne
# montrait qu'un filament par champ et une bouillie aux époques jeunes (planche D-essai1-moyenne-hz2.png).

on:
  push:
    branches: [fond-de-carte]
    paths: ['.github/workflows/fond-de-carte-moyenne.yml', 'sim/pm.py']
  workflow_dispatch:

jobs:
  simulation:
    # essai 3 (18/11, 16 h 20) : positions de départ tirées dans leur cellule (GIGUE), pour la boîte
    # moyenne et la petite : le treillis des époques jeunes venait de la grille de départ projetée
    strategy:
      fail-fast: false
      matrix:
        include:
          - { boite: moyenne, l: 64, graine: 27182, hz: 5, npts: 600000, liss: 0.7 }
          - { boite: petite, l: 200, graine: 31415, hz: 6, npts: 500000, liss: 2 }
    name: Boîte ${{ matrix.boite }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NSORTIES: 32
      FOULE: 8
      GIGUE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Place disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy scipy pillow
      - name: Simulation
        run: python sim/pm.py 512 640 ${{ matrix.l }} /tmp/sim 48 ${{ matrix.graine }}
      - name: Post-traitement
        run: python sim/post2.py /tmp/sim sorties-v3/${{ matrix.boite }} ${{ matrix.boite }} ${{ matrix.hz }} ${{ matrix.npts }} 4 8 ${{ matrix.liss }}
      - uses: actions/upload-artifact@v4
        with:
          name: sorties-v3-${{ matrix.boite }}
          path: sorties-v3/${{ matrix.boite }}

  commit:
    needs: simulation
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fond-de-carte
      - uses: actions/download-artifact@v4
        with:
          path: sim/sorties-v3
          pattern: sorties-v3-*
      - name: Commit des sorties
        run: |
          find sim/sorties-v3 -name '*.bin' -exec gzip -9f {} \;
          git config user.name "fond-de-carte[bot]"
          git config user.email "fond-de-carte@users.noreply.github.com"
          git add sim/sorties-v3
          git commit -m "Sorties v3 (boîtes moyenne et petite, départ tiré dans les cellules) [skip ci]" || { echo "rien à committer"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin fond-de-carte && git push && break; sleep 10; done
