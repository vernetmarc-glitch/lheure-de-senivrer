name: Chantier S7 — Alpes

# Le bac à sable ne joint pas les données ouvertes (Copernicus, EOX, Zenodo).
# Déclenché par push sur chantier/alpes, ce workflow :
#   1. prépare le relief réel (chantiers/alpes/reel_1024.npz) ;
#   2. télécharge la mosaïque Sentinel-2 sans nuages (EOX) et apprend les règles de couleur ;
#   3. reprojette les glaciers PISM de Seguinot et al. 2018 (épaisseur, vitesses, moraines) ;
#   4. relance la simulation FastScape (512²) si son empreinte change ;
#   5. pousse le paquet léger (app/public/labo/alpes/donnees/) sur la branche.
# Les scripts restent dans chantiers/alpes/ (jamais publiés).

on:
  push:
    branches: [chantier/alpes]
    paths:
      - 'chantiers/alpes/**'
      - '.github/workflows/chantier-alpes.yml'
  workflow_dispatch:

concurrency:
  group: chantier-alpes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  alpes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: chantiers/alpes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chantier/alpes
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        run: pip install --quiet numpy scipy pillow rasterio pyproj netCDF4 fastscapelib==0.3.0
      - name: Relief réel (Copernicus GLO-90)
        run: |
          E=$(sha256sum prepare_mnt.py | cut -c1-16)
          if [ ! -f reel_1024.npz ] || [ "$(cat reel_1024.empreinte 2>/dev/null)" != "$E" ]; then
            python prepare_mnt.py && echo "$E" > reel_1024.empreinte
          else echo "relief réel à jour"; fi
      - name: Mosaïque Sentinel-2 sans nuages (EOX s2cloudless) et règles de couleur
        run: |
          E=$(sha256sum prepare_mosaique.py | cut -c1-16)
          if [ ! -f ../../app/public/labo/alpes/donnees/mosaique_2048.jpg ] || [ "$(cat mosaique.empreinte 2>/dev/null)" != "$E" ]; then
            python prepare_mosaique.py && echo "$E" > mosaique.empreinte
          else echo "mosaïque à jour"; fi
          python regles_couleurs.py
      - name: Glaciers du dernier cycle (Seguinot et al. 2018, PISM)
        run: |
          E=$(cat prepare_glace.py moraines.py | sha256sum | cut -c1-16)
          if [ ! -f ../../app/public/labo/alpes/donnees/vitesses.bin.gz ] || [ "$(cat glace.empreinte 2>/dev/null)" != "$E" ]; then
            python prepare_glace.py && echo "$E" > glace.empreinte
          else echo "glaciers à jour"; fi
      - name: Simulation FastScape
        run: |
          E=$(cat simuler.py scenario.py reel_1024.empreinte | sha256sum | cut -c1-16)
          if [ "$(cat simulation.empreinte 2>/dev/null)" = "$E" ]; then echo "simulation à jour"; exit 0; fi
          python simuler.py --n 512 && echo "$E" > simulation.empreinte
      - name: Pousser le paquet
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          rm -f app/public/labo/alpes/donnees/empreinte.txt
          git add -A app/public/labo/alpes/donnees chantiers/alpes
          if git diff --cached --quiet; then echo "rien à pousser"; exit 0; fi
          git commit -m "Alpes : relief, mosaïque, glaciers et simulation recalculés (workflow)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin chantier/alpes && git push origin HEAD:chantier/alpes && exit 0
            sleep 10
          done
          exit 1
