name: Fond de carte v2 — 32 instantanés, vitesses, agitation

# Plan « fond de carte » du 17/11/2026 (P1, P2, P5) : mêmes simulations particle-mesh 512³,
# mais 32 instantanés réguliers en facteur de croissance (mouvement régulier entre deux),
# une particule sur 8 sauvée avec sa vitesse, et un fichier par instantané pour la page
# (positions, taille du noyau, agitation des vitesses voisines).

on:
  push:
    branches: [fond-de-carte]
    paths: ['sim/post2.py', '.github/workflows/fond-de-carte-v2.yml']
  workflow_dispatch:

jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { boite: petite, np: 512, nm: 640, l: 200, hz: 6, npts: 500000, dmin: 4, dmax: 8, liss: 2 }
          - { boite: grande, np: 512, nm: 512, l: 1500, hz: 30, npts: 400000, dmin: 1.5, dmax: 3, liss: 8 }
    name: Boîte ${{ matrix.boite }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NSORTIES: 32
      FOULE: 8
    steps:
      - uses: actions/checkout@v4
      - name: Place disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy scipy pillow
      - name: Simulation
        run: python sim/pm.py ${{ matrix.np }} ${{ matrix.nm }} ${{ matrix.l }} /tmp/sim 48
      - name: Post-traitement
        run: python sim/post2.py /tmp/sim sorties-v2/${{ matrix.boite }} ${{ matrix.boite }} ${{ matrix.hz }} ${{ matrix.npts }} ${{ matrix.dmin }} ${{ matrix.dmax }} ${{ matrix.liss }}
      - uses: actions/upload-artifact@v4
        with:
          name: sorties-v2-${{ matrix.boite }}
          path: sorties-v2/${{ matrix.boite }}

  commit:
    needs: simulation
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fond-de-carte
      - uses: actions/download-artifact@v4
        with:
          path: sim/sorties-v2
          pattern: sorties-v2-*
      - name: Commit des sorties
        run: |
          find sim/sorties-v2 -name '*.bin' -exec gzip -9f {} \;
          git config user.name "fond-de-carte[bot]"
          git config user.email "fond-de-carte@users.noreply.github.com"
          git add sim/sorties-v2
          git commit -m "Sorties v2 des simulations (32 instantanés, agitation) [skip ci]" || { echo "rien à committer"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin fond-de-carte && git push && break; sleep 10; done
