<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Heure de s'enivrer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Nuit cosmique, un seul thème. La lumière est le seul objet froid et vif ; le fond est chaud et sourd.
     Disposition reprise de l'application : zoom vertical à droite, temps horizontal en bas. */
  --nuit: #04050a;
  --voile: rgba(6, 8, 14, 0.72);
  --texte: #e8e6df;
  --doux: #9a9fab;
  --trait: rgba(255,255,255,0.16);
  --accent: #cfe6ff;
  --f-titre: "Cinzel", "Times New Roman", serif;
  --f-corps: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--nuit); color: var(--texte); font-family: var(--f-corps); overflow: hidden; }
#carte, #matiere { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#matiere { background: #04050a; }
#titre { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 14px; display: flex; align-items: center; gap: 8px; }
h1 { font-family: var(--f-titre); font-weight: 600; font-size: 16px; letter-spacing: 0.03em; margin: 0; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.rond { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
#apropos { width: 20px; height: 20px; font: italic 12px Georgia, serif; }
button {
  font: 500 13px var(--f-corps); color: var(--texte); background: rgba(20,22,30,0.6);
  border: 1px solid var(--trait); border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.actif { background: var(--accent); color: #0a0f18; border-color: var(--accent); }
input[type=range] { accent-color: var(--accent); margin: 0; }
/* zoom vertical, bord droit */
#zoomBloc { position: fixed; right: max(4px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top) + 56px); bottom: calc(env(safe-area-inset-bottom) + 205px); width: 44px; touch-action: none; }
#zoom { position: absolute; top: 50%; left: 50%; height: 30px; transform: translate(-50%, -50%) rotate(90deg); touch-action: none; }
#reperesZoom { position: absolute; inset: 0; pointer-events: none; }
#reperesZoom span { position: absolute; right: 40px; transform: translateY(-50%); font-size: 9.5px; color: rgba(154,159,171,0.8); white-space: nowrap; text-shadow: 0 1px 3px #000; }
#reperesZoom span::after { content: ""; display: inline-block; width: 6px; height: 1px; background: var(--doux); vertical-align: middle; margin-left: 4px; }
/* bas : légende, actions, temps */
#bas { position: fixed; left: 0; right: 52px; bottom: 0; padding: 0 14px calc(env(safe-area-inset-bottom) + 10px); display: grid; gap: 8px;
  background: linear-gradient(to top, var(--voile) 65%, rgba(6,8,14,0)); }
#bas > * { min-width: 0; }
#phrase { font-size: 13px; line-height: 1.4; min-height: 18px; text-shadow: 0 1px 3px #000; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puces button { flex: 0 0 auto; font-size: 12px; padding: 5px 10px; }
.puces .sep { flex: 0 0 100%; height: 0; }
#tempsBloc { display: flex; align-items: center; gap: 10px; }
.piste { flex: 1; position: relative; padding-top: 16px; padding-bottom: 14px; }
#lectureTemps { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--texte); font-variant-numeric: tabular-nums; }
#temps { width: 100%; }
.reperes { position: absolute; left: 0; right: 0; bottom: 0; height: 13px; font-size: 10px; color: var(--doux); }
.reperes span { position: absolute; white-space: nowrap; }
#repAuj { transform: translateX(-50%); }
#repAuj::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: var(--doux); }
/* fenêtre « à propos » */
#modale { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 20px; }
#modale.ouverte { display: flex; }
#modale > div { max-width: 520px; max-height: 80%; overflow: auto; background: #0c0e15; border: 1px solid var(--trait); border-radius: 12px; padding: 18px 20px; font-size: 14.5px; line-height: 1.55; }
#modale h2 { font-family: var(--f-titre); font-weight: 500; font-size: 17px; margin: 0 0 10px; }
#modaleBoutons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
#menuLumiere { position: fixed; display: none; flex-direction: column; gap: 6px; padding: 8px; background: #0c0e15; border: 1px solid var(--trait); border-radius: 12px; z-index: 5; }
#menuLumiere.ouvert { display: flex; }
#menuLumiere button { text-align: left; border-radius: 10px; }
#menuLumiere small { display: block; color: var(--doux); font-weight: 400; font-size: 11px; }
#chargement { position: fixed; top: calc(env(safe-area-inset-top) + 40px); left: 14px; font-size: 11px; color: var(--doux); }
#phrase { cursor: pointer; }
#phrase .suite { color: var(--doux); }
@media (min-width: 900px) and (min-height: 650px) { #bas, #titre, #reperesZoom, #chargement, #menuLumiere { zoom: 1.3; } }
</style>
</head>
<body>
<canvas id="matiere" aria-hidden="true"></canvas>
<canvas id="carte" aria-label="Carte de l'univers en distances réelles, avec la progression de la lumière"></canvas>
<div id="titre">
  <h1>L'Heure de s'enivrer</h1>
  <button id="apropos" class="rond" aria-label="À propos">i</button>
</div>
<div id="zoomBloc">
  <input id="zoom" type="range" min="0" max="1000" step="1" aria-label="Champ de vue">
  <div id="reperesZoom"></div>
</div>
<div id="bas">
  <div id="phrase"></div>
  <div class="puces" role="group" aria-label="Scénarios et lumière">
    <button data-scen="observable" aria-label="Scénario : univers observable">Observable</button>
    <button data-scen="hubble" aria-label="Scénario : sphère de Hubble">Hubble</button>
    <button data-scen="evenements" aria-label="Scénario : horizon des événements">Horizon</button>
    <span class="sep"></span>
    <button id="lumiere" aria-haspopup="true" aria-expanded="false">Lumière ▾</button>
    <button id="spheres" class="actif" aria-pressed="true">Sphères</button>
  </div>
  <div id="tempsBloc">
    <button id="lecture" class="rond" aria-label="Lecture">▶</button>
    <div class="piste">
      <div id="lectureTemps"></div>
      <input id="temps" type="range" min="0" max="1000" step="1" aria-label="Temps">
      <div class="reperes"><span style="left:0">Big Bang</span><span id="repAuj">aujourd'hui</span></div>
    </div>
  </div>
</div>
<div id="menuLumiere" role="menu">
  <button id="versNous" role="menuitem">Vers nous <small>elle arrive aujourd'hui</small></button>
  <button id="depuisNous" role="menuitem">Depuis nous <small>un éclair part d'ici</small></button>
</div>
<div id="chargement">matière : chargement…</div>
<div id="modale" role="dialog" aria-modal="true" aria-labelledby="modaleTitre">
  <div>
    <h2 id="modaleTitre">L'Heure de s'enivrer</h2>
    <div id="modaleCorps"></div>
    <div id="modaleBoutons"><button id="fermer">Fermer</button></div>
  </div>
</div>
<template id="txtApropos">
    <p>Cette carte est une tentative — nécessairement imparfaite — de rendre sensible ce que les nombres, seuls, ne peuvent qu'énoncer : que la lumière qui vous atteint ce soir a parfois quitté sa source avant que la Terre n'existe ; que l'espace lui-même s'étire, silencieusement, entre chaque point que vous voyez ; que l'univers observable, ce halo de 93 milliards d'années-lumière qui vous entoure, n'est peut-être qu'une fraction infime de ce qui existe réellement au-delà de ce que la lumière a eu le temps de nous apporter.</p>
    <p>Zoomez, et vous traverserez en un geste des distances que la lumière met des milliards d'années à parcourir. Remontez le temps, et vous verrez la matière se resserrer, jusqu'au seuil où l'univers devient trop dense, trop jeune, pour qu'aucune lumière n'ait encore pu s'en échapper.</p>
    <p>Il n'y a pas de centre à cette carte — seulement le point d'où nous regardons, comme n'importe quel autre point de l'univers pourrait le faire.</p>
</template>
<template id="txtAccueil">
    <p>Depuis la toile cosmique jusqu'aux confins de ce que la lumière a jamais pu nous révéler — 93 milliards d'années-lumière d'univers observable tiennent entre vos doigts. Zoomez avec le curseur de droite, voyagez dans le temps avec celui du bas, et laissez-vous porter.</p>
    <p>Les trois boutons Observable, Hubble et Horizon racontent chacun l'une des trois limites de l'univers.</p>
</template>
<template id="txtObservable">
    <p>L'univers observable marque la limite de ce qu'il est physiquement possible d'observer aujourd'hui : la distance parcourue par la lumière la plus ancienne qui ait jamais pu nous atteindre, depuis les tout premiers instants de l'univers.</p>
    <p>Ce n'est pas un mur, ni une limite de l'univers lui-même — l'univers continue sans doute bien au-delà. C'est simplement la frontière de notre part visible : au-delà, la lumière existe peut-être, mais elle n'a pas encore eu le temps de nous parvenir.</p>
    <p>Ce cercle grandit avec le temps : plus l'univers vieillit, plus la lumière a eu de temps pour voyager, et plus notre part visible s'agrandit.</p>
</template>
<template id="txtHubble">
    <p>La sphère de Hubble est la distance où l'expansion éloigne les galaxies de nous exactement à la vitesse de la lumière, à l'instant présent. Au-delà, elles s'éloignent plus vite qu'elle.</p>
    <p>Ce n'est pas une limite de vision : la lumière qui en part fait d'abord du surplace, puis, comme l'expansion ralentit, la sphère grandit, la dépasse, et cette lumière finit par nous atteindre.</p>
</template>
<template id="txtEvenements">
    <p>L'horizon des événements est le vrai point de non-retour. Ce qui se produit aujourd'hui au-delà ne nous parviendra jamais, même en attendant l'éternité : l'énergie noire entretient l'expansion, et la lumière n'y gagne jamais assez de terrain.</p>
    <p>Il se définit par le futur. Avec le temps, les galaxies lointaines le franchissent une à une et disparaissent de notre avenir.</p>
</template>
<script>
(() => {
"use strict";
// ---------------------------------------------------------------------------
// Cosmologie du projet (Planck 2018), distances en milliards d'années-lumière
// ---------------------------------------------------------------------------
const OM = 0.315, OR = 9.24e-5, OL = 1 - OM - OR;
const DH = 14.507;          // c/H0 en Gal
const TH = 14.507;          // 1/H0 en Ga
const E = a => Math.sqrt(OR / a ** 4 + OM / a ** 3 + OL);
const NT = 9000, LA0 = Math.log(1e-7), LA1 = Math.log(400);
const LA = new Float64Array(NT), A = new Float64Array(NT), T = new Float64Array(NT), ETA = new Float64Array(NT);
for (let i = 0; i < NT; i++) { LA[i] = LA0 + (LA1 - LA0) * i / (NT - 1); A[i] = Math.exp(LA[i]); }
T[0] = A[0] ** 2 / (2 * Math.sqrt(OR)) * TH;
ETA[0] = A[0] / Math.sqrt(OR) * DH;
for (let i = 1; i < NT; i++) {
  const d = LA[i] - LA[i - 1];
  T[i] = T[i - 1] + 0.5 * d * (1 / E(A[i]) + 1 / E(A[i - 1])) * TH;
  ETA[i] = ETA[i - 1] + 0.5 * d * (1 / (A[i] * E(A[i])) + 1 / (A[i - 1] * E(A[i - 1]))) * DH;
}
const ETA_INF = ETA[NT - 1] + DH / (Math.sqrt(OL) * A[NT - 1]);
function idxT(t) { let lo = 0, hi = NT - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; } return lo; }
function at(t) { // état cosmologique à l'âge t (Ga)
  const i = idxT(t), f = (t - T[i]) / (T[i + 1] - T[i]);
  return { a: A[i] + (A[i + 1] - A[i]) * f, eta: ETA[i] + (ETA[i + 1] - ETA[i]) * f };
}
const T0 = (() => { let lo = 0, hi = NT - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (A[m] <= 1) lo = m; else hi = m; } return T[lo]; })();
const ETA0 = at(T0).eta;
const TMIN = 0.00035, TMAX = 100, TREC = 0.00037;   // TREC : recombinaison, 370 000 ans
// curseur de temps réparti : les 500 premiers millions d'années en échelle logarithmique (15 %),
// puis l'histoire jusqu'à aujourd'hui en temps linéaire (70 %), puis le futur (15 %)
const U1 = 150, U2 = 850, TA = 0.5;
const tFromU = u => u <= U1 ? Math.exp(Math.log(TMIN) + (Math.log(TA) - Math.log(TMIN)) * u / U1)
  : u <= U2 ? TA + (T0 - TA) * (u - U1) / (U2 - U1)
  : Math.exp(Math.log(T0) + (Math.log(TMAX) - Math.log(T0)) * (u - U2) / (1000 - U2));
const uFromT = t => t <= TA ? U1 * (Math.log(t) - Math.log(TMIN)) / (Math.log(TA) - Math.log(TMIN))
  : t <= T0 ? U1 + (U2 - U1) * (t - TA) / (T0 - TA)
  : U2 + (1000 - U2) * (Math.log(t) - Math.log(T0)) / (Math.log(TMAX) - Math.log(T0));
const WMIN = 0.00006, WMAX = 90;
const wFromU = u => Math.exp(Math.log(WMIN) + (Math.log(WMAX) - Math.log(WMIN)) * u / 1000);
const uFromW = w => 1000 * (Math.log(w) - Math.log(WMIN)) / (Math.log(WMAX) - Math.log(WMIN));

// ---------------------------------------------------------------------------
// Fond : tranches de la simulation N-corps à plusieurs époques, en motif
// périodique ; une tuile = 312 Mpc comobiles = 1,016 Gal comobile.
// ---------------------------------------------------------------------------
// deux simulations 512³ : une petite boîte (toile fine) et une grande (grands champs),
// chacune rendue en tuile périodique à 11 instants (z = 14 à aujourd'hui)
const TUILE_GAL = 0.96782, GRANDE_GAL = 7.25866;
const AT = [0.0667, 0.0909, 0.1250, 0.1667, 0.2222, 0.2857, 0.3704, 0.5000, 0.6667, 0.8333, 1.0000];
const jeu = nom => AT.map(a => { const im = new Image(); im.src = `tuiles/${nom}-a${a.toFixed(4)}.jpg`; return { a, im, moy: "rgb(20,4,2)", motif: null }; });
const imgsP = jeu("petite"), imgsG = jeu("grande"), imgs = imgsP.concat(imgsG);
let pretes = 0;
imgs.forEach(o => o.im.onload = () => {
  const c = document.createElement("canvas"); c.width = c.height = 16;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(o.im, 0, 0, 16, 16);
  const d = x.getImageData(0, 0, 16, 16).data; let r = 0, g = 0, b = 0;
  for (let k = 0; k < d.length; k += 4) { r += d[k]; g += d[k + 1]; b += d[k + 2]; }
  o.moy = `rgb(${Math.round(r / 256)},${Math.round(g / 256)},${Math.round(b / 256)})`;
  o.motif = true; pretes++; sale = true;
});
// Pavage sans répétition visible : chaque copie de la boîte est tournée d'un quart
// de tour et/ou retournée selon un tirage fixe (la copie qui nous contient reste
// droite, elle se raccorde aux points WebGL). Au-dessous de 256 px par copie, on
// pave avec une « super-tuile » de 4×4 copies déjà orientées (motif 4 fois plus long).
const orient = (i, j) => (i === 0 && j === 0) ? 0 : ((Math.imul(i * 73856093 ^ j * 19349663, 2654435761) >>> 13) & 7);
function placeCopie(c, o, x, y, T) {
  c.translate(x, y); c.rotate((o & 3) * Math.PI / 2); if (o & 4) c.scale(-1, 1);
}
// décalage périodique propre à chaque copie : sans lui, toutes les copies gardent au
// centre le même gros nœud (notre superamas) et le pavage réapparaît en réseau de points
const decale = (i, j) => (i === 0 && j === 0) ? [0, 0] : [((Math.imul(i * 2246822519 ^ j * 3266489917, 668265263) >>> 8) & 1023) / 1024, ((Math.imul(i * 374761393 ^ j * 1103515245, 2654435761) >>> 8) & 1023) / 1024];
// dessine une copie (déjà placée au centre de sa case) : contenu décalé, raccordé par périodicité
function copieDecalee(c, src, T, [ox, oy]) {
  if (ox === 0 && oy === 0) { c.drawImage(src, -T / 2, -T / 2, T, T); return; }
  c.save(); c.beginPath(); c.rect(-T / 2, -T / 2, T, T); c.clip();
  for (const a of [0, 1]) for (const b of [0, 1]) c.drawImage(src, -T / 2 - ox * T + a * T, -T / 2 - oy * T + b * T, T, T);
  c.restore();
}
const superTuiles = new Map();
function superTuile(o) {
  let st = superTuiles.get(o.im.src); if (st) return st;
  const n = 4, T = 256, c = document.createElement("canvas"); c.width = c.height = n * T;
  // réduction par moitiés successives : pas de crénelage
  let src = o.im, w = o.im.width;
  while (w / 2 >= T) { const h = document.createElement("canvas"); h.width = h.height = w / 2; const hx = h.getContext("2d"); hx.imageSmoothingQuality = "high"; hx.drawImage(src, 0, 0, w / 2, w / 2); src = h; w /= 2; }
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const ii = i >= n / 2 ? i - n : i, jj = j >= n / 2 ? j - n : j;   // la cellule 0 reste droite
    x.setTransform(1, 0, 0, 1, 0, 0); placeCopie(x, orient(ii, jj), (i + 0.5) * T, (j + 0.5) * T, T);
    copieDecalee(x, src, T, decale(ii, jj));
  }
  st = ctx.createPattern(c, "repeat"); st.cote = n * T;
  if (superTuiles.size > 6) superTuiles.delete(superTuiles.keys().next().value);
  superTuiles.set(o.im.src, st); return st;
}

// ---------------------------------------------------------------------------
// État
// ---------------------------------------------------------------------------
const cv = document.getElementById("carte"), ctx = cv.getContext("2d");
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DPR = 1, Wpx = 0, Hpx = 0, US = 1;   // US : échelle des textes du canevas (grands écrans)
let t = T0;              // âge affiché (Ga) : aujourd'hui
let W = 55;             // demi-champ (Gal) : tout l'univers observable
let scen = null, voirSpheres = true, lecture = false, sale = true;
let fronts = [];
let phase = 0;

function tailleZoom() {
  const h = document.getElementById("zoomBloc").clientHeight;
  elZ.style.width = h + "px";
  const rz = document.getElementById("reperesZoom"); rz.innerHTML = "";
  for (const [w, txt] of [[0.00025, "Voie lactée"], [0.13, "superamas"], [1.2, "toile cosmique"], [14.5, "sphère de Hubble"], [46, "univers observable"]]) {
    const sp = document.createElement("span"); sp.textContent = txt; sp.style.top = (uFromW(w) / 1000 * 100) + "%"; rz.appendChild(sp);
  }
}
function taille() {
  US = Math.min(Math.max(Math.min(innerWidth, innerHeight) / 420, 1), 1.6);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  Wpx = Math.round(cv.clientWidth * DPR); Hpx = Math.round(cv.clientHeight * DPR);
  cv.width = Wpx; cv.height = Hpx; matiere.taille(Wpx, Hpx); sale = true;
}
addEventListener("resize", () => { taille(); tailleZoom(); });

function rayonFront(f, tt) { // rayon propre (Gal) d'un front à l'âge tt, ou null
  // in : lumière émise à te depuis la distance comobile chi0 (par défaut : celle qui arrive aujourd'hui)
  const s = at(tt), e = at(f.te);
  if (tt < f.te) return null;
  if (f.sens === "in") {
    const chi = (f.chi0 ?? (ETA0 - e.eta)) - (s.eta - e.eta);
    return chi > 0 ? { r: s.a * chi, s: s.a / e.a } : null;
  }
  return { r: s.a * (s.eta - e.eta), s: s.a / e.a };
}
function marqueurs(f, tt) { // galaxies associées au front
  const s = at(tt), e = at(f.te);
  if (tt < f.te) return null;
  if (f.sens === "in") return { r: s.a * (f.chi0 ?? (ETA0 - e.eta)), txt: f.etiquette ?? "galaxies qui ont émis cette lumière" };
  return { r: s.a * (ETA_INF - e.eta), txt: f.etiquetteMarq ?? "galaxies que l'éclair n'atteindra jamais" };
}

// ---------------------------------------------------------------------------
// Matière en WebGL : chaque particule de la tranche simulée est un petit
// noyau gaussien dont la taille suit la densité locale (rendu de type SPH).
// Les noyaux s'additionnent dans une texture flottante, puis un ton
// logarithmique à bornes FIXES (rapportées à la densité moyenne) et la
// palette feu donnent l'image. Positions interpolées entre 5 instantanés,
// multipliées par le facteur d'échelle : la matière se resserre en remontant.
// ---------------------------------------------------------------------------
// base64 → octets par le décodeur natif du navigateur (bien plus rapide que atob + map)
// Données : en base64 (.txt) dans l'artefact, en binaire compressé (.bin.gz) sur GitHub Pages
const SUR_GITHUB = /github\.io$/.test(location.hostname) || new URLSearchParams(location.search).has("gz");
async function octets(nom, progres) {
  const url = SUR_GITHUB ? `donnees/${nom}.bin.gz` : `${nom}.txt`;
  const r = await fetch(url); if (!r.ok) throw new Error(`${url} : ${r.status}`);
  const tot = +r.headers.get("content-length") || 0, lect = r.body.getReader(), morceaux = []; let lu = 0;
  for (;;) { const { done, value } = await lect.read(); if (done) break; morceaux.push(value); lu += value.length; if (progres) progres(tot ? Math.min(1, lu / tot) : 0); }
  const brut = new Uint8Array(await new Blob(morceaux).arrayBuffer());
  if (brut[0] === 0x1f && brut[1] === 0x8b)   // gzip (si le serveur ne l'a pas déjà décompressé)
    return new Uint8Array(await new Response(new Blob([brut]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  if (url.endsWith(".gz")) return brut;
  return deBase64(new TextDecoder().decode(brut));

function fmt(g) { return g >= 20 ? `${g.toFixed(0)} Gal` : g >= 10 ? `${g.toFixed(1).replace(".", ",")} Gal` : g >= 1 ? `${g.toFixed(1).replace(".", ",")} Gal` : g >= 0.001 ? `${(g * 1000).toFixed(0)} Mal` : `${(g * 1e6).toFixed(0)} 000 al`; }

// ---------------------------------------------------------------------------
// Commandes
// ---------------------------------------------------------------------------
const elT = document.getElementById("temps"), elZ = document.getElementById("zoom"), elL = document.getElementById("lecture");
elT.value = uFromT(t); elZ.value = uFromW(W);
elT.addEventListener("input", () => { libre(); t = tFromU(+elT.value); sale = true; });

// ---------------------------------------------------------------------------
// Scénarios : chacun montre une seule limite, à sa taille d'aujourd'hui

const SCEN = {

// galaxies-témoins du scénario « horizon » : 70 positions comobiles fixes, jusqu'à 1,35 × l'horizon
const alea = k => { const x = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

function lanceScenario(cle) {

const bS = document.getElementById("spheres");
bS.addEventListener("click", () => { libre(); voirSpheres = !voirSpheres; bS.classList.toggle("actif", voirSpheres); bS.setAttribute("aria-pressed", voirSpheres); sale = true; });

const touches = new Map(); let d0 = 0, W0 = W;

const INFOS = { p: ["L'univers observable", "txtObservable"], h: ["La sphère de Hubble", "txtHubble"], e: ["L'horizon des événements", "txtEvenements"] };
