<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">L’Heure de s’enivrer — icône</title>
<desc id="desc">Trois horizons concentriques traversés par un rayon lumineux rouge, blanc et bleu.</desc>
<defs>
  <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="492" y2="0">
    <stop offset="0" stop-color="#ff593d"/>
    <stop offset=".42" stop-color="#ffb06d"/>
    <stop offset=".52" stop-color="#fff9ed"/>
    <stop offset=".72" stop-color="#a99aff"/>
    <stop offset="1" stop-color="#8bcaff"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#fff"/>
    <stop offset=".16" stop-color="#fff8e8"/>
    <stop offset=".42" stop-color="#cfe6ff" stop-opacity=".72"/>
    <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rings" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9b67"/>
    <stop offset=".48" stop-color="#d7c9ff"/>
    <stop offset="1" stop-color="#9bd5ff"/>
  </linearGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1600" height="700">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <clipPath id="clip"><rect x="12" y="12" width="488" height="488" rx="94"/></clipPath>
</defs>
<g>
  <rect width="512" height="512" fill="#04050a"/>
  <circle cx="256" cy="256" r="212" fill="#11142b" opacity=".42"/>
  <g fill="none" stroke="url(#rings)" stroke-width="2.2">
    <circle cx="256" cy="256" r="74" opacity=".92"/>
    <circle cx="256" cy="256" r="132" opacity=".78"/>
    <circle cx="256" cy="256" r="190" opacity=".72"/>
  </g>
  <path d="M20 256 H492" stroke="url(#ray)" stroke-width="22" opacity=".48" filter="url(#glow)"/>
  <path d="M20 256 H492" stroke="url(#ray)" stroke-width="3.2" opacity=".95"/>
  <circle cx="256" cy="256" r="38" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="11" fill="#fffdf7"/>
  <g fill="#d9eaff">
    <circle cx="91" cy="188" r="2.2" opacity=".85"/>
    <circle cx="125" cy="334" r="1.7" opacity=".7"/>
    <circle cx="183" cy="89" r="1.6" opacity=".65"/>
    <circle cx="361" cy="104" r="1.8" opacity=".7"/>
    <circle cx="407" cy="320" r="2" opacity=".72"/>
    <circle cx="335" cy="405" r="1.5" opacity=".65"/>
    <circle cx="65" cy="278" r="1.3" opacity=".55"/>
    <circle cx="448" cy="211" r="1.4" opacity=".6"/>
  </g>
  
</g>
</svg>