<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 440" role="img" aria-labelledby="title desc">
<title id="title">L’Heure de s’enivrer — logo horizontal</title>
<desc id="desc">Icône des trois horizons lumineux et nom de l’application en typographie sérif.</desc>
<defs>
  <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="1270" y2="0">
    <stop offset="0" stop-color="#ff593d"/><stop offset=".42" stop-color="#ffb06d"/>
    <stop offset=".52" stop-color="#fff9ed"/><stop offset=".72" stop-color="#a99aff"/><stop offset="1" stop-color="#8bcaff"/>
  </linearGradient>
  <linearGradient id="rings" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9b67"/><stop offset=".48" stop-color="#d7c9ff"/><stop offset="1" stop-color="#9bd5ff"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#cfe6ff" stop-opacity=".7"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1600" height="700"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="clip"><rect x="22" y="22" width="396" height="396" rx="76"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect x="22" y="22" width="396" height="396" fill="#04050a"/>
  <g fill="none" stroke="url(#rings)" stroke-width="2">
    <circle cx="220" cy="220" r="57"/><circle cx="220" cy="220" r="102" opacity=".8"/><circle cx="220" cy="220" r="147" opacity=".72"/>
  </g>
  <path d="M22 220 H418" stroke="url(#ray)" stroke-width="18" opacity=".45" filter="url(#glow)"/>
  <path d="M22 220 H418" stroke="url(#ray)" stroke-width="3"/>
  <circle cx="220" cy="220" r="34" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="220" cy="220" r="9" fill="#fffdf7"/>
  <g fill="#d9eaff"><circle cx="91" cy="126" r="2"/><circle cx="345" cy="130" r="1.8"/><circle cx="110" cy="324" r="1.7"/><circle cx="352" cy="315" r="2"/></g>
  <rect x="22" y="22" width="396" height="396" rx="76" fill="none" stroke="#29324b" stroke-width="2"/>
</g>
<g fill="#f4f0e8" font-family="Cinzel, 'Times New Roman', serif" font-weight="400" letter-spacing="7">
  <text x="490" y="190" font-size="82">L’HEURE</text>
  <text x="490" y="292" font-size="82">DE S’ENIVRER</text>
</g>
<path d="M492 328 H1270" stroke="url(#ray)" stroke-width="1.5" opacity=".78"/>
</svg>